<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth; /* Enable smooth scrolling */
        }

        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('images/landing.jpg') no-repeat center center/cover;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container {
            background: transparent;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transform: translateY(-50px);
            animation: slideIn 1.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 40px;
            color: #333;
            animation: fadeInText 2s ease-in-out;
        }

        h4 {
            color: #555;
            animation: fadeInText 2.5s ease-in-out;
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }

        .scroll-btn:hover {
            background: darkgreen;
            transform: scale(1.1);
        }

        #login-section {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <section>
        <div class="container">
            <h1>FOOD RECIPE</h1>
            <h4>Discover delicious recipes crafted for you with fresh ingredients.</h4>
            <a href="#login-section" class="scroll-btn">Go to Login</a>
        </div>
    </section>

    <script>
        function login() {
            alert("Login button clicked!");
        }
    </script>
</body>
</html>
